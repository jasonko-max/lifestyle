
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYS_06 現金流量收支平衡表 - 生活型態財務邏輯</title>

  <!-- 🌐 網頁圖示與社群卡片設定 -->
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google 字體：Inter、Noto Serif TC、Space Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-canvas: #dfe5e1;       /* 啞光鼠尾草灰綠 */
      --card-surface: #faf8f5;    /* 溫和手帳奶白 */
      --header-deep: #222e27;     /* 結構深墨黑綠 */
      --sage-primary: #3b5245;    /* 架構墨綠 */
      --sage-muted: #5e7568;      /* 說明文字灰綠 */
      --amber-accent: #c86f32;    /* 琥珀焦糖亮點色 */
      --amber-bg: #fcf3eb;        /* 琥珀淡底 */
      --border-soft: #d3ccc0;     /* 沉著細邊框 */
      --input-bg: #e9edea;        /* 低反光輸入底 */
      --text-title: #222e27;      /* 標題深墨黑 */
      --text-body: #3c4b42;       /* 內文墨黑 */
      --summary-bg: #f7efe4;      /* 淺焙焦糖唯讀底 */
      --danger-color: #b8334a;    /* 支出赤字紅 */
      --success-color: #21613e;   /* 盈餘收益綠 */
      --breakeven-bg: #fcedf0;    /* 兩平警戒淡紅 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-body);
      padding: 0 0 40px 0;
      line-height: 1.4;
      background-image: 
        linear-gradient(rgba(70, 95, 80, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(70, 95, 80, 0.05) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .mono {
      font-family: 'Space Mono', monospace;
    }

    /* 統一頂部導覽 Header */
    .blueprint-header {
      background-color: var(--header-deep);
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(34, 46, 39, 0.15);
      border-bottom: 1px solid #3c4a40;
      position: sticky;
      top: 0;
      z-index: 40;
      padding: 12px 20px;
    }

    .header-inner {
      max-width: 1750px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #d1ded6;
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .back-home:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
    }

    .sys-badge {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(200, 111, 50, 0.2);
      color: var(--amber-accent);
      border: 1px solid rgba(200, 111, 50, 0.4);
      letter-spacing: 1px;
    }

    .header-title-text {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
      letter-spacing: 0.5px;
      color: #ffffff;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.08);
      color: #e5ede8;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }

    .btn-action:hover {
      background: #ffffff;
      color: var(--header-deep);
      border-color: #ffffff;
    }

    .btn-danger {
      background: rgba(184, 51, 74, 0.25);
      border-color: rgba(184, 51, 74, 0.4);
      color: #fca5a5;
    }
    .btn-danger:hover {
      background: #b8334a;
      color: #ffffff;
      border-color: #b8334a;
    }

    .container {
      max-width: 1750px;
      margin: 16px auto 0;
      padding: 0 14px;
    }

    .dashboard-horizontal {
      display: flex;
      flex-direction: row;
      gap: 12px;
      margin-bottom: 15px;
      align-items: stretch;
    }

    @media (max-width: 1280px) {
      .dashboard-horizontal {
        flex-direction: column;
      }
    }

    .card {
      background: var(--card-surface);
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(34, 46, 39, 0.03);
      border: 1px solid var(--border-soft);
    }

    .card-title {
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--text-title);
      border-bottom: 2px solid var(--sage-primary);
      padding-bottom: 4px;
      margin-bottom: 10px;
      white-space: nowrap;
      letter-spacing: 0.5px;
    }

    .targets-card { flex: 3.2; min-width: 320px; }
    .targets-horizontal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
    }
    .target-item-box {
      background: #f2eee8;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--border-soft);
    }

    .expenses-card { flex: 2.8; min-width: 300px; }
    .expenses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
      gap: 6px;
      margin-bottom: 10px;
    }
    .incomes-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .summary-card {
      flex: 2.2;
      min-width: 260px;
      background-color: var(--summary-bg);
      border: 1px solid #e3d4c1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .summary-grid-top, .summary-grid-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 6px;
    }

    .summary-box {
      background: var(--card-surface);
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid var(--border-soft);
    }
    .summary-box .label {
      font-size: 0.68rem;
      color: var(--sage-muted);
      font-weight: 600;
    }
    .summary-box .value {
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--text-title);
      text-align: right;
      font-family: 'Space Mono', monospace;
    }
    .summary-box.highlight {
      background: var(--amber-bg);
      border-color: rgba(200, 111, 50, 0.4);
    }
    .summary-box.highlight .label {
      color: #8c4e20;
    }
    .summary-box.highlight .value {
      font-size: 0.95rem;
      color: var(--amber-accent);
    }

    .form-group-compact {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .form-group-compact label {
      font-size: 0.72rem;
      color: var(--sage-muted);
      font-weight: 600;
    }

    /* 建築手稿輸入框：啞光淡綠底，聚焦時琥珀橘高亮 */
    input[type="number"], input[type="text"] {
      width: 100%;
      padding: 4px 6px;
      border: 1px solid var(--border-soft);
      border-radius: 4px;
      background-color: var(--input-bg);
      text-align: right;
      font-weight: 600;
      font-size: 0.82rem;
      color: var(--text-title);
      font-family: 'Space Mono', monospace;
      outline: none;
      transition: all 0.2s ease;
    }
    input[type="text"] {
      text-align: left;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    input:focus {
      border-color: var(--amber-accent);
      box-shadow: 0 0 0 2px rgba(200, 111, 50, 0.2);
      background-color: #ffffff;
    }

    /* 表格容器與 Sticky Header */
    .table-container {
      background: var(--card-surface);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(34, 46, 39, 0.03);
      border: 1px solid var(--border-soft);
      overflow-x: auto;
      max-height: 70vh;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 0.76rem;
      white-space: nowrap;
      background: var(--card-surface);
    }

    th, td {
      padding: 6px 8px;
      text-align: right;
      border-right: 1px solid var(--border-soft);
      border-bottom: 1px solid var(--border-soft);
    }

    th {
      background-color: #f2eee8;
      color: var(--text-title);
      font-weight: 700;
      position: sticky;
      top: 0;
      z-index: 2;
      font-size: 0.74rem;
    }

    thead tr:nth-child(2) th {
      top: 29px;
    }

    .th-header-group {
      background-color: var(--header-deep);
      color: #ffffff;
      text-align: center;
      letter-spacing: 0.5px;
    }

    tr:nth-child(even) { background-color: #f8faf9; }
    tr:hover { background-color: #f2eee8; }

    .text-center { text-align: center; }
    .font-bold { font-weight: bold; }

    .negative { color: var(--danger-color); font-weight: bold; font-family: 'Space Mono', monospace; }
    .positive { color: var(--success-color); font-weight: bold; font-family: 'Space Mono', monospace; }

    /* 損益平衡轉折線高亮 */
    tr.breakeven-row {
      background-color: var(--breakeven-bg) !important;
      outline: 2px solid var(--danger-color);
    }
    .breakeven-tag {
      background-color: var(--danger-color);
      color: white;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 700;
    }

    @media print {
      body { background-color: #ffffff !important; background-image: none !important; padding: 0 !important; }
      .blueprint-header { display: none !important; }
      .header-actions { display: none !important; }
      .dashboard-horizontal { display: flex !important; flex-direction: row !important; }
      .card, .summary-card { break-inside: avoid; box-shadow: none !important; }
      .table-container { border: none !important; box-shadow: none !important; max-height: none !important; overflow: visible !important; }
      th { position: static !important; }
    }
  </style>
</head>
<body>

<!-- 統一頂部導覽 Header -->
<header class="blueprint-header">
  <div class="header-inner">
    <div class="header-left">
 <!-- 1. 返回第二層：模組一覽 (不用重新看封面) -->
    <a href="index.html#modules-overview" class="back-home">
        <span class="mono">←</span> 返回上一頁
    </a>
    <!-- 2. 返回第一層：品牌封面 -->
    <a href="index.html#hero-cover" class="back-home">
        <i class="fa-solid fa-house text-xs"></i> 封面
    </a>
    <span style="color:#5e7568;" class="mono text-xs">/</span>
    <span class="sys-badge">SYS_01</span>
      <h1 class="header-title-text">現金流量收支平衡表</h1>
    </div>
    <div class="header-actions">
      <button class="btn-action" onclick="exportData()">
        <i class="fa-solid fa-file-export text-emerald-400"></i> 匯出備份 (.json)
      </button>
      <button class="btn-action" onclick="document.getElementById('import-file').click()">
        <i class="fa-solid fa-file-import text-amber-400"></i> 匯入備份
      </button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
      <button class="btn-action" onclick="window.print()">
        <i class="fa-solid fa-print text-indigo-300"></i> 列印報告 (PDF)
      </button>
      <button class="btn-action btn-danger" onclick="resetDefaults()">
        <i class="fa-solid fa-arrow-rotate-left"></i> 清空重置
      </button>
    </div>
  </div>
</header>

<div class="container">
  <div class="dashboard-horizontal">
    
    <!-- 1. 標的輸入 -->
    <div class="card targets-card">
      <div class="card-title">投資標的與配息設定</div>
      <div class="targets-horizontal-grid" id="targets-container"></div>
    </div>

    <!-- 2. 固定支出與收入 -->
    <div class="card expenses-card">
      <div class="card-title">固定支出設定 (月)</div>
      <div class="expenses-grid">
        <div class="form-group-compact">
          <label for="expense-life">生活費</label>
          <input type="number" id="expense-life" value="0" onfocus="this.select()" oninput="onInputChange()">
        </div>
        <div class="form-group-compact">
          <label for="expense-ins">勞健保險</label>
          <input type="number" id="expense-ins" value="0" onfocus="this.select()" oninput="onInputChange()">
        </div>
        <div class="form-group-compact">
          <label for="expense-loan">信貸</label>
          <input type="number" id="expense-loan" value="0" onfocus="this.select()" oninput="onInputChange()">
        </div>
        <div class="form-group-compact">
          <label for="expense-pledge">質押利息</label>
          <input type="number" id="expense-pledge" value="0" onfocus="this.select()" oninput="onInputChange()">
        </div>
        <div class="form-group-compact">
          <label for="expense-extra">額外支出</label>
          <input type="number" id="expense-extra" value="0" onfocus="this.select()" oninput="onInputChange()">
        </div>
      </div>

      <div class="card-title" style="margin-top: 6px;">收入來源設定 (月)</div>
      <div class="incomes-grid">
        <div class="form-group-compact">
          <label for="income-active" style="color: var(--sage-primary);">主動收入</label>
          <input type="number" id="income-active" value="0" onfocus="this.select()" oninput="onInputChange()">
        </div>
        <div class="form-group-compact">
          <label for="income-other1" style="color: var(--sage-primary);">其他收入 1</label>
          <input type="number" id="income-other1" value="0" onfocus="this.select()" oninput="onInputChange()">
        </div>
        <div class="form-group-compact">
          <label for="income-other2" style="color: var(--sage-primary);">其他收入 2</label>
          <input type="number" id="income-other2" value="0" onfocus="this.select()" oninput="onInputChange()">
        </div>
      </div>
    </div>

    <!-- 3. 支出總計彙整 -->
    <div class="card summary-card">
      <div class="card-title" style="color: #8c4e20; border-color: var(--amber-accent);">支出總計彙整</div>
      <div class="summary-grid-top">
        <div class="summary-box">
          <div class="label">生活支出/月</div>
          <div class="value" id="sum-life-monthly">$0</div>
        </div>
        <div class="summary-box">
          <div class="label">負債支出/月</div>
          <div class="value" id="sum-debt-monthly">$0</div>
        </div>
        <div class="summary-box">
          <div class="label">額外支出/月</div>
          <div class="value" id="sum-extra-monthly">$0</div>
        </div>
      </div>

      <div class="summary-grid-row">
        <div class="summary-box highlight">
          <div class="label">月總支出 (防守線)</div>
          <div class="value" id="sum-total-monthly">$0</div>
        </div>
        <div class="summary-box highlight">
          <div class="label">季總支出</div>
          <div class="value" id="sum-total-quarterly">$0</div>
        </div>
        <div class="summary-box highlight">
          <div class="label">年總支出</div>
          <div class="value" id="sum-total-yearly">$0</div>
        </div>
      </div>
    </div>

  </div>

  <!-- 下半部：試算表格 -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th rowspan="2" class="text-center" style="width: 75px;">情境</th>
          <th rowspan="2" class="text-center mono" style="width: 45px;">階梯</th>
          <th rowspan="2" class="text-center mono" style="width: 60px;">配息%</th>
          <th colspan="2" class="th-header-group" id="th-target-0">標的 1</th>
          <th colspan="2" class="th-header-group" id="th-target-1">標的 2</th>
          <th colspan="2" class="th-header-group" id="th-target-2">標的 3</th>
          <th colspan="2" class="th-header-group" id="th-target-3">標的 4</th>
          <th rowspan="2">月被動息收</th>
          <th rowspan="2">合計月收入</th>
          <th rowspan="2">合計季收入</th>
          <th rowspan="2">合計年收入</th>
          <th rowspan="2">月餘額 (損益)</th>
          <th rowspan="2">季餘額</th>
          <th rowspan="2">年度餘額</th>
        </tr>
        <tr>
          <th>當季配息</th>
          <th>稅後淨額</th>
          <th>當季配息</th>
          <th>稅後淨額</th>
          <th>當季配息</th>
          <th>稅後淨額</th>
          <th>當季配息</th>
          <th>稅後淨額</th>
        </tr>
      </thead>
      <tbody id="matrix-tbody"></tbody>
    </table>
  </div>

</div>

<script>
  const defaultTargets = [
    { name: '標的 A', shares: 0, dividend: 0 },
    { name: '標的 B', shares: 0, dividend: 0 },
    { name: '標的 C', shares: 0, dividend: 0 },
    { name: '標的 D', shares: 0, dividend: 0 }
  ];

  let targets = JSON.parse(JSON.stringify(defaultTargets));

  function initTargetsUI() {
    const container = document.getElementById('targets-container');
    let html = '';
    targets.forEach((t, i) => {
      html += `
        <div class="target-item-box">
          <div class="form-group-compact" style="margin-bottom:4px;">
            <input type="text" id="target-name-${i}" value="${t.name}" oninput="onInputChange()" style="font-weight:bold;">
          </div>
          <div class="form-group-compact" style="margin-bottom:4px;">
            <label>持有股數</label>
            <input type="number" id="target-shares-${i}" value="${t.shares}" onfocus="this.select()" oninput="onInputChange()">
          </div>
          <div class="form-group-compact">
            <label>單季配息($)</label>
            <input type="number" step="0.01" id="target-div-${i}" value="${t.dividend}" onfocus="this.select()" oninput="onInputChange()">
          </div>
        </div>
      `;
    });
    container.innerHTML = html;
  }

  function formatMoney(num) {
    return Math.round(num).toLocaleString('zh-TW');
  }

  function onInputChange() {
    calculateAll();
    saveToLocalStorage();
  }

  function calculateAll() {
    for (let i = 0; i < 4; i++) {
      targets[i].name = document.getElementById(`target-name-${i}`).value || `標的 ${i+1}`;
      targets[i].shares = parseFloat(document.getElementById(`target-shares-${i}`).value) || 0;
      targets[i].dividend = parseFloat(document.getElementById(`target-div-${i}`).value) || 0;
      document.getElementById(`th-target-${i}`).innerText = targets[i].name;
    }

    const expLife = parseFloat(document.getElementById('expense-life').value) || 0;
    const expIns = parseFloat(document.getElementById('expense-ins').value) || 0;
    const expLoan = parseFloat(document.getElementById('expense-loan').value) || 0;
    const expPledge = parseFloat(document.getElementById('expense-pledge').value) || 0;
    const expExtra = parseFloat(document.getElementById('expense-extra').value) || 0;

    const incActive = parseFloat(document.getElementById('income-active').value) || 0;
    const incOther1 = parseFloat(document.getElementById('income-other1').value) || 0;
    const incOther2 = parseFloat(document.getElementById('income-other2').value) || 0;
    const totalActiveMonthly = incActive + incOther1 + incOther2;

    const lifeMonthly = expLife + expIns;
    const debtMonthly = expLoan + expPledge;
    const totalMonthly = lifeMonthly + debtMonthly + expExtra;
    const totalQuarterly = totalMonthly * 3;
    const totalYearly = totalMonthly * 12;

    document.getElementById('sum-life-monthly').innerText = '$' + formatMoney(lifeMonthly);
    document.getElementById('sum-debt-monthly').innerText = '$' + formatMoney(debtMonthly);
    document.getElementById('sum-extra-monthly').innerText = '$' + formatMoney(expExtra);
    document.getElementById('sum-total-monthly').innerText = '$' + formatMoney(totalMonthly);
    document.getElementById('sum-total-quarterly').innerText = '$' + formatMoney(totalQuarterly);
    document.getElementById('sum-total-yearly').innerText = '$' + formatMoney(totalYearly);

    let rowsHTML = '';
    let currentRatio = 1.0;
    let breakevenTriggered = false;

    for (let step = 1; step <= 25; step++) {
      let scenarioTag = '';
      if (step === 1) scenarioTag = '基準(100%)';
      else if (step === 21) scenarioTag = '腰斬(50%)';
      else if (step === 25) scenarioTag = '極悲觀(40%)';

      let quarterlyNetDividendSum = 0;
      let targetColsHTML = '';

      for (let i = 0; i < 4; i++) {
        const adjustedDiv = targets[i].dividend * currentRatio;
        const grossDividend = targets[i].shares * adjustedDiv;
        
        let netIncome = grossDividend;
        if (grossDividend >= 20000) {
          const taxableBase = Math.min(grossDividend, 10000000);
          const nhiFee = Math.round(taxableBase * 0.0211);
          netIncome = grossDividend - nhiFee;
        }

        quarterlyNetDividendSum += netIncome;

        targetColsHTML += `
          <td class="mono">${adjustedDiv.toFixed(3)}</td>
          <td class="mono">${formatMoney(netIncome)}</td>
        `;
      }

      const totalQuarterlyIncome = quarterlyNetDividendSum + (totalActiveMonthly * 3);
      const totalMonthlyIncome = totalQuarterlyIncome / 3;
      const totalYearlyIncome = totalQuarterlyIncome * 4;
      const monthlyPassiveIncome = quarterlyNetDividendSum / 3;

      const monthlyBalance = totalMonthlyIncome - totalMonthly;
      const quarterlyBalance = monthlyBalance * 3;
      const yearlyBalance = monthlyBalance * 12;

      let isBreakevenStep = false;
      if (!breakevenTriggered && monthlyBalance < 0 && totalMonthly > 0) {
        isBreakevenStep = true;
        breakevenTriggered = true;
        if (!scenarioTag) scenarioTag = '<span class="breakeven-tag">兩平警戒</span>';
      }

      const balanceClass = monthlyBalance < 0 ? 'negative' : 'positive';
      const rowClass = isBreakevenStep ? 'breakeven-row' : '';

      rowsHTML += `
        <tr class="${rowClass}">
          <td class="text-center font-bold">${scenarioTag}</td>
          <td class="text-center mono">${step}</td>
          <td class="text-center font-bold mono">${(currentRatio * 100).toFixed(1)}%</td>
          ${targetColsHTML}
          <td class="mono" style="color:var(--sage-primary); font-weight:700;">${formatMoney(monthlyPassiveIncome)}</td>
          <td class="font-bold mono">${formatMoney(totalMonthlyIncome)}</td>
          <td class="mono">${formatMoney(totalQuarterlyIncome)}</td>
          <td class="mono">${formatMoney(totalYearlyIncome)}</td>
          <td class="${balanceClass}">${formatMoney(monthlyBalance)}</td>
          <td class="${balanceClass}">${formatMoney(quarterlyBalance)}</td>
          <td class="${balanceClass}">${formatMoney(yearlyBalance)}</td>
        </tr>
      `;

      currentRatio -= 0.025;
    }

    document.getElementById('matrix-tbody').innerHTML = rowsHTML;
  }

  const STORAGE_KEY = 'cashflow_calculator_data_v2';

  function saveToLocalStorage() {
    const data = {
      targets: targets,
      expenses: {
        life: document.getElementById('expense-life').value,
        ins: document.getElementById('expense-ins').value,
        loan: document.getElementById('expense-loan').value,
        pledge: document.getElementById('expense-pledge').value,
        extra: document.getElementById('expense-extra').value
      },
      incomes: {
        active: document.getElementById('income-active').value,
        other1: document.getElementById('income-other1').value,
        other2: document.getElementById('income-other2').value
      }
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function loadFromLocalStorage() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return false;
    try {
      const data = JSON.parse(saved);
      if (data.targets) targets = data.targets;
      if (data.expenses) {
        document.getElementById('expense-life').value = data.expenses.life ?? 0;
        document.getElementById('expense-ins').value = data.expenses.ins ?? 0;
        document.getElementById('expense-loan').value = data.expenses.loan ?? 0;
        document.getElementById('expense-pledge').value = data.expenses.pledge ?? 0;
        document.getElementById('expense-extra').value = data.expenses.extra ?? 0;
      }
      if (data.incomes) {
        document.getElementById('income-active').value = data.incomes.active ?? 0;
        document.getElementById('income-other1').value = data.incomes.other1 ?? 0;
        document.getElementById('income-other2').value = data.incomes.other2 ?? 0;
      }
      return true;
    } catch (e) {
      console.error('無效的備份資料', e);
      return false;
    }
  }

  function exportData() {
    saveToLocalStorage();
    const dataStr = localStorage.getItem(STORAGE_KEY);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `SYS06_收支平衡表備份_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        localStorage.setItem(STORAGE_KEY, e.target.result);
        loadFromLocalStorage();
        initTargetsUI();
        calculateAll();
        alert('匯入成功！');
      } catch (err) {
        alert('檔案格式錯誤，匯入失敗！');
      }
    };
    reader.readAsText(file);
  }

  function resetDefaults() {
    if (confirm('確定要清空為 0 並還原為初始設定嗎？')) {
      localStorage.removeItem(STORAGE_KEY);
      targets = JSON.parse(JSON.stringify(defaultTargets));
      document.getElementById('expense-life').value = 0;
      document.getElementById('expense-ins').value = 0;
      document.getElementById('expense-loan').value = 0;
      document.getElementById('expense-pledge').value = 0;
      document.getElementById('expense-extra').value = 0;
      document.getElementById('income-active').value = 0;
      document.getElementById('income-other1').value = 0;
      document.getElementById('income-other2').value = 0;
      initTargetsUI();
      calculateAll();
    }
  }

  window.onload = function() {
    loadFromLocalStorage();
    initTargetsUI();
    calculateAll();
  };
</script>
